name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Explain the skipped deploy
        if: env.API_TOKEN == '' || env.ACCOUNT_ID == ''
        run: |
          echo "Skipped: this run needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >> "$GITHUB_STEP_SUMMARY"
          echo "Until they exist, deploy with: npx wrangler pages deploy public --project-name baselio --branch main" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        if: env.API_TOKEN != '' && env.ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name baselio --branch main
